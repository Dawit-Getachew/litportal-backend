name: "[App] CI/CD"

on:
  push:
    # `feat/aws` added TEMPORARILY (2026-07-23) so pushes while this branch
    # is under active development auto-run the full pipeline (including a
    # real deploy) instead of needing a manual workflow_dispatch every time
    # -- see the `deploy-branch` override below, which this must stay in
    # sync with. Remove `feat/aws` from this list in the same change that
    # removes that override, once the branch merges or the test is done.
    branches: [main, feat/aws]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy-branch:
        description: 'Branch to treat as the trusted push/deploy branch for this manual run -- must match a branch AppDeployRole-litportal-backend actually trusts (src/github-deploy-roles-stack.ts TEMP_TEST_BRANCHES in scienthesis-cdk). Does NOT change which branch the workflow itself runs from -- that is still whatever ref/branch you pick in the "Use workflow from" dropdown when dispatching. Left as "feat/aws" by default to match the temporary override below; override here (e.g. back to "main") for a one-off manual run without editing this file.'
        required: false
        type: string
        default: feat/aws

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-cd:
    # Shared pipeline logic (lint -> test -> build -> Trivy scan -> push to
    # ECR -> register task-def revision -> ecs update-service -> wait for
    # stable) lives in scienthesis-cdk, the infra repo, so it only needs to
    # change in one place for all 4 Scienthesis backend services. See that
    # file's own header comment for the full design rationale, including
    # exactly which IAM permissions this relies on and which branch(es) it
    # will actually push/deploy from (`deploy-branch` input, default "main").
    #
    # `permissions` here is required, not optional -- a reusable workflow's
    # nested jobs can never be granted MORE than the calling job itself has.
    # app-deploy.yml's build-scan-push/deploy jobs both request
    # `id-token: write` for the OIDC AssumeRoleWithWebIdentity call; without
    # this block the caller job defaults to `id-token: none`, and every real
    # deploy fails closed with "requesting 'id-token: write', but is only
    # allowed 'id-token: none'" regardless of what app-deploy.yml itself
    # declares. Found and fixed 2026-07-23 while testing
    # scienthesis-identity's pipeline -- applied here too since none of the 4
    # app repos had ever run a real Actions-triggered deploy before that, so
    # this gap hadn't surfaced yet in any of them.
    permissions:
      contents: read
      id-token: write
    uses: Scienthesis-Loka/scienthesis-cdk/.github/workflows/app-deploy.yml@main
    with:
      service-name: litportal-backend
      # AppDeployRoleArn-litportal-backend output from the GithubDeployRoles-prod
      # stack (fetched read-only 2026-07-22). Not a secret -- see
      # app-deploy.yml's `deploy-role-arn` input doc comment.
      deploy-role-arn: arn:aws:iam::217794632783:role/GithubDeployRoles-prod-AppDeployRolelitportalbacken-kb7ySIYIZgUF
      # requirements.txt (not pyproject.toml/uv.lock) -- installs straight
      # into the runner's system Python; matches how the Dockerfile's
      # builder stage installs deps, just without the venv since this
      # runner is thrown away after the job.
      install-command: "uv pip install --system -r requirements.txt"
      # ruff + black + mypy are already dev deps in requirements.txt
      # (confirmed 2026-07-22) -- adjust here if that tooling ever changes,
      # no need to touch the shared workflow.
      lint-command: "ruff check . && black --check . && mypy ."
      # TEMPORARILY ALLOWED TO FAIL (2026-07-24, Lisandro) -- first-ever run
      # of this pipeline (Actions run 30096768416) found 306 pre-existing
      # ruff errors (228 in tests/, 78 in services/routers/scripts/), none
      # introduced by this CI change, plus pytest aborts collection entirely
      # (3 broken test files -- see test-continue-on-error note below).
      # Rather than blanking lint-command (which hides it entirely), this
      # opts into app-deploy.yml's lint-continue-on-error input: the Lint
      # step still runs and its failures still show up as a visibly flagged
      # allowed-failure in the Actions UI/PR checks, it just no longer blocks
      # Test or the downstream Build/Deploy jobs. REVERT to false once
      # litportal-backend's lint debt is cleaned up -- don't let this drift
      # into main permanently soft.
      lint-continue-on-error: true
      # `-n auto` added 2026-08-13 -- this repo's own pytest.ini already
      # assumes xdist parallelization (`--dist=loadgroup` +
      # `xdist_group` markers exist specifically to make parallel runs safe
      # against Mongo shared-state flake, per that file's own comment: "Default
      # still uses `-n auto` from the developer's invocation"), but CI was
      # invoking plain `pytest`, running all ~4450 tests serially. Found after
      # Actions run 31686390589 sat `in_progress` for 4h46m before being
      # manually cancelled -- app-deploy.yml's `lint-and-test` job had no
      # timeout-minutes at all (GitHub's unset default is 6h), so nothing would
      # have stopped it before then.
      #
      # Bounded in two passes the same day: first with a single JOB-level
      # `timeout-minutes: 20` on `lint-and-test`, which turned out to cancel
      # the ENTIRE job (Lint + Test + setup, and by extension skipped
      # build-scan-push/deploy too) at 20 minutes even on a healthy run --
      # a job-level timeout can't be masked by continue-on-error the way a
      # step-level one can, so it was stopping the whole pipeline, not just
      # bounding the hang it was meant to catch. Fixed by splitting
      # app-deploy.yml's single input into `test-timeout-minutes` (STEP-level,
      # only on Test, default 10 -- masked by `test-continue-on-error: true`
      # below exactly like a normal pytest failure, so a Test step that hits
      # this cap still lets build-scan-push/deploy run) and
      # `job-timeout-minutes` (JOB-level outer backstop, default 45, covers a
      # genuine hang in checkout/install/Lint that continue-on-error can't
      # help with). Neither is overridden here -- both defaults already fit
      # this repo. If a real, healthy `-n auto` run of this suite needs longer
      # than 10 minutes for a full/passing signal, raise this repo's own
      # `test-timeout-minutes` override rather than accepting a partial run
      # every time; for now, partial-but-fast is preferred over
      # complete-but-blocking while `test-continue-on-error` is already true
      # for the unrelated collection-error reason below. This does NOT fix the
      # suite's own slow/hanging tests (several "*_live_api.py" files look
      # like they make real unmocked external calls -- e.g.
      # test_phase6c_live_api.py errors instead of skipping cleanly the way
      # test_phase6d_live_api.py does) -- that's Scienthesis-owned test-suite
      # debt, flagged to them separately, not something to fix from this repo.
      test-command: "pytest -n auto"
      # TEMPORARILY ALLOWED TO FAIL (2026-07-24, Lisandro) -- same mechanism
      # as lint-continue-on-error above, for the Test step. Needed here
      # because pytest currently aborts with "Interrupted: 3 errors during
      # collection" before running any of the other 4419 collected tests:
      # tests/test_phase2b_live_api.py requires a REACT_APP_BACKEND_URL env
      # var this CI runner doesn't set (looks like a live/integration test,
      # not a unit test), and tests/test_phase6f1_live_acceptance.py /
      # tests/test_phase6f_live_api.py call pytest.skip() at module level
      # without allow_module_level=True. All three are Scienthesis-owned
      # test-suite issues, not something introduced by this CI change.
      # Note: this flag only stops the CI job from blocking on pytest's
      # non-zero exit -- it does NOT make pytest run the other 4419 tests
      # instead of aborting at collection. If partial results are wanted
      # (not just "did the job turn red"), test-command would also need
      # pytest's own `--continue-on-collection-errors` flag, which is a
      # separate, still-open decision -- left as `pytest` unchanged for now.
      # REVERT to false once these collection errors are fixed.
      test-continue-on-error: true
      # TEMPORARILY ALLOWED TO FAIL (2026-07-24, Lisandro) -- same mechanism
      # again, for the Trivy vulnerability scan in build-scan-push. First
      # real run against this image (git SHA fabbac5) found 19 HIGH findings
      # in Python deps (cryptography, pillow, pyasn1, pypdf,
      # python-multipart, starlette -- all have a fixed version already
      # published) plus 20 findings (18 HIGH, 2 CRITICAL) in the s5cmd
      # binary vendored into the image, which is statically built against a
      # very old Go stdlib (v1.20.8) carrying its own pile of CVEs
      # independent of anything in requirements.txt. None of this is new
      # from this CI change -- it's the current state of the image. Full
      # findings written up separately for Scienthesis so they can
      # prioritize the dependency bumps. REVERT to false once these are
      # patched.
      trivy-continue-on-error: true
      # TEMPORARY (added 2026-07-23) -- lets Lisandro test this service's
      # real build/scan/push/deploy pipeline against `feat/aws` before it
      # merges to main, same as scienthesis-identity/scienthesis-lithub.
      # Only works because AppDeployRole-litportal-backend now also trusts
      # `feat/aws` (TEMP_TEST_BRANCHES in
      # scienthesis-cdk/src/github-deploy-roles-stack.ts) -- the two must
      # stay in sync. Revert this to match the default ("main", i.e. remove
      # the override entirely) once `feat/aws` merges or the test is done --
      # don't leave prod pointed at a feature branch.
      #
      # `github.event.inputs.deploy-branch` is only ever populated on a
      # manual `workflow_dispatch` run (the `push`/`pull_request` triggers
      # above don't set it), so this falls back to the hardcoded "feat/aws"
      # for every automatic push -- the `|| 'feat/aws'` isn't a generic
      # default, it's this same temporary value duplicated so both trigger
      # paths agree. The workflow_dispatch input just gives a way to
      # override it for a one-off manual run (e.g. dispatch with
      # deploy-branch=main to sanity-check the normal path still works)
      # without editing this file.
      deploy-branch: ${{ github.event.inputs.deploy-branch || 'feat/aws' }}
