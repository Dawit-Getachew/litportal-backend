[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
# Phase 6F closeout (IMPL-4) — pin the live-API regression files +
# phase4a-pipeline integration file to a single xdist worker via
# ``--dist loadgroup``. The xdist_group markers in those files
# instruct xdist to keep ALL tests within the same group on ONE
# worker, which eliminates the MongoDB shared-state / startup-event
# parallel-execution flake observed under default ``loadscope``
# distribution. Default still uses ``-n auto`` from the developer's
# invocation; no other test files are pinned.
addopts = --dist=loadgroup
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
